# Đặt file này ở <repo>/.github/workflows/backend-ci.yml
# Chạy lint + type check + toàn bộ test mỗi khi push/PR đụng vào backend/.
# Render autoDeployTrigger=checksPass -> chỉ deploy khi workflow này xanh. Không cần database.
name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # CI chỉ đọc code, không có quyền ghi repo, không có secret production

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_TIMEZONE: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests --select E,F,W,B,UP,I --ignore UP042,B008 --line-length 120
      - run: mypy app --ignore-missing-imports --strict
      - run: pytest -q
      - name: Template + Sheet master mẫu hợp lệ
        # CI không có key Google nên lệnh check báo thiếu service account (exit 1) — chỉ cần master + template OK
        run: |
          python -m app.cli check --master-file deploy/MASTER_BBNT_TEMPLATE.xlsx > check.log || true
          cat check.log
          grep -q "Sheet master: 2 pháp nhân" check.log
          ! grep -q "\[FAIL\] Template" check.log
          ! grep -q "\[FAIL\] .* dòng" check.log

  migrations:
    # Postgres tạm trong CI — không có secret, không đụng database thật.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: recon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      RECON_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/recon_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_recon_migrations.py tests/test_recon_db.py tests/test_recon_runner.py
